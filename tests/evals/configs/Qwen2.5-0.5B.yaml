# Base checkpoint: no chat template, plain few-shot completion.
# Smoke-sized on purpose — this is the config `make test-eval` picks up.
model_dir: my_weight/Qwen2.5-0.5B
num_questions: 200
num_fewshot: 5
max_gen_len: 256
batch_size: 32
max_seq_len: 2048
chat_template: false
# Measured 0.3500 on an A10; see docs/eval_models.md.
accuracy_threshold: 0.35
tolerance: 0.05
max_invalid_rate: 0.05
