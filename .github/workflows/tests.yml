name: tests

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install CPU-only PyTorch and the package
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --python .venv/bin/python torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --python .venv/bin/python -e '.[serve]' --group dev

      - name: Import check
        run: .venv/bin/python -c "from rapid_llm import LLM, ContinuousBatchingEngine; import importlib.util; assert importlib.util.find_spec('triton') is None"

      # GitHub-hosted runners have no GPU, so the Triton kernel and end-to-end
      # tests are deselected here; they run in the self-hosted `gpu-tests` job.
      # The floor is set just under the current CPU-tier number: it exists to
      # catch a tier going dark (as the weights tier silently did), not to chase
      # a percentage.
      - name: Run CPU test subset
        run: >
          .venv/bin/python -m pytest -m "not gpu and not weights"
          --cov=rapid_llm --cov-report=term-missing --cov-fail-under=48

  gpu-tests:
    name: GPU tests
    # Opt-in: only runs when a CUDA-capable self-hosted runner is registered
    # with the `gpu` label. Skipped silently on forks without one.
    runs-on: [self-hosted, gpu]
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-gpu') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the package
        run: |
          uv venv --python 3.13
          uv pip install --python .venv/bin/python -e '.[cuda,serve]' --group dev

      - name: Show GPU
        run: nvidia-smi

      # No marker filter: `gpu` needs the CUDA this runner has, and `weights`
      # auto-skips (with a reason) when the runner has no converted checkpoint.
      # Mount one at my_weight/ and the end-to-end plus golden tiers run too.
      - name: Run GPU tests
        run: .venv/bin/python -m pytest
