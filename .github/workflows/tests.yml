name: tests

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-tests:
    name: CPU tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install CPU-only PyTorch and the package
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group dev

      - name: Import check
        run: uv run python -c "import lite_llama; print(lite_llama.__version__)"

      # GitHub-hosted runners have no GPU, so the Triton kernel and end-to-end
      # tests are deselected here; they run in the self-hosted `gpu-tests` job.
      - name: Run CPU test subset
        run: uv run pytest -m "not gpu and not weights" --cov=lite_llama --cov-report=term-missing

  gpu-tests:
    name: GPU tests
    # Opt-in: only runs when a CUDA-capable self-hosted runner is registered
    # with the `gpu` label. Skipped silently on forks without one.
    runs-on: [self-hosted, gpu]
    if: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ci-gpu') }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the package
        run: |
          uv venv --python 3.12
          uv pip install -e . --group dev

      - name: Show GPU
        run: nvidia-smi

      - name: Run GPU tests
        run: uv run pytest -m "not weights"
