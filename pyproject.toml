[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lite-llama"
version = "0.9.0"
description = "A lightweight, Triton-kernel based LLM inference framework for LLaMA / Qwen / LLaVA / Qwen3-VL"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "harleyszhang", email = "zhg5200211@outlook.com" }]
keywords = ["llm", "inference", "triton", "cuda", "transformer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # torch/triton are validated up to torch 2.13 + triton 3.7 (the latest at the
  # time of writing). The version floor is intentionally loose; the *hard*
  # requirement is that the installed torch's CUDA build not exceed the local
  # driver's CUDA version. On a driver that ships CUDA 12.x (e.g. NVIDIA 550.x on
  # A10) install a cu12x wheel explicitly, otherwise pip may resolve a cu13x
  # build that fails at runtime with torch.cuda.is_available() == False:
  #   uv pip install torch --index-url https://download.pytorch.org/whl/cu129
  "torch>=2.4",
  "triton>=3.0; platform_system == 'Linux'",
  "transformers>=4.51",
  # Weights are read straight from HuggingFace *.safetensors shards.
  "safetensors>=0.4",
  "numpy>=1.24",
  "tqdm>=4.65",
  "pillow>=10.0",
  "requests>=2.31",
  "rich>=13.0",
]

[project.optional-dependencies]
# Accuracy evaluation: the harness under examples/evaluator (sentence embeddings)
# and the benchmark suite under tests/evals (YAML model configs).
eval = ["sentence-transformers>=4.0", "pyyaml>=6.0"]
# OpenAI-compatible HTTP server (`lite-llama serve`). Optional so that offline
# generation does not drag a web stack in; the imports live inside
# lite_llama/entrypoints/api_server.py and name this extra when it is missing.
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
# External kernel backends (ROADMAP foundation 2). Never core dependencies: a
# missing library must degrade to the native Triton floor, which is what
# lite_llama/kernels/backend/probe.py probes for and dispatch acts on.
#
# Only flashinfer has anything pip can resolve (distribution `flashinfer-python`,
# import `flashinfer`). DeepGEMM, FlashMLA and DeepEP are recursive clones built
# against the local CUDA — DeepEP also needs NVSHMEM — so they get no extra
# rather than an extra that installs nothing: their verified build recipes live
# in each backend module's INSTALL and are printed by `survey()`.
flashinfer = ["flashinfer-python>=0.2"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # tests/entrypoints drives the async engine and the ASGI app.
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff==0.16.3",
  "pre-commit>=4.0",
  # tests/evals reads its model configs from YAML.
  "pyyaml>=6.0",
]

[project.scripts]
lite-llama = "lite_llama.cli:main"

[project.urls]
Homepage = "https://github.com/harleyszhang/lite_llama"
Repository = "https://github.com/harleyszhang/lite_llama"

[tool.setuptools.packages.find]
include = ["lite_llama*"]

[tool.setuptools.package-data]
lite_llama = ["py.typed"]

# --------------------------------------------------------------------------- #
# Ruff: linter + formatter (replaces black/isort/flake8)
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs", "images", "my_weight"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501",   # line length is handled by the formatter
  "E741",   # ambiguous names (l, I) are idiomatic inside Triton kernels
  "B008",   # function call in argument default
  "SIM108", # ternary instead of if-else is not always more readable
  # This codebase preserves the original Chinese comments and docstrings.
  # Rejecting fullwidth punctuation would force wholesale rewriting of the
  # authors' original teaching material for no functional gain.
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Triton kernels take many positional pointer/stride arguments and shadow math
# builtins; benchmark helpers intentionally use star-imports and prints.
"lite_llama/kernels/*" = ["B905"]
"tests/*" = ["B011"]
# Preserved teaching material: the authors' Chinese labels use fullwidth
# punctuation inside string literals, same rationale as the global RUF002/RUF003
# exemption. Benchmark scripts print and star-import on purpose.
"examples/teaching/*" = ["RUF001"]
# Benchmarks: `lambda: kernel(...)` is the shape triton.testing.do_bench wants,
# `import apex` is an availability probe, and unused locals document the tuning
# knobs a reader may want to switch on.
"benchmarks/kernels/*" = ["E402", "E731", "F401", "F403", "F405", "F841", "RUF001"]

[tool.ruff.format]
docstring-code-format = true

[tool.uv.pip]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
# --import-mode=importlib keeps ``tests`` importable as a package so tests can
# share tests/reference.py and tests/golden/cases.py instead of copy-pasting
# reference implementations into each file.
addopts = "-ra --strict-markers --strict-config"
markers = [
  "gpu: requires a CUDA device (auto-skipped on CPU-only machines; applied automatically to tests/kernels/)",
  "weights: requires a converted checkpoint (auto-skipped when none is found; override the location with LITE_LLAMA_TEST_MODEL_DIR)",
  "slow: takes seconds rather than milliseconds (golden regression); excluded by `make test-fast`",
  "eval: benchmark accuracy run driven by tests/evals/configs (minutes, needs the dataset); run it with `make test-eval`",
  "serving: exercises the async engine or the HTTP API (needs the `serve` extra)",
]
# Async tests are plain `async def` without a per-test decorator.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::FutureWarning:torch.*",
  # Triton's code generator builds ast.AnnAssign without `simple`; nothing we control.
  "ignore:AnnAssign.__init__ missing:DeprecationWarning",
  # tqdm calls datetime.utcfromtimestamp internally.
  "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
]

[tool.coverage.run]
source = ["lite_llama"]
branch = true
omit = []

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
]
